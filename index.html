<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075985">
  <meta name="description" content="A simple mobile scorecard for SDLTA matches.">
  <title>SDLTA Scorecard</title>
  <style>
    :root { color-scheme: light; --blue:#075985; --blue-dark:#0c4a6e; --ink:#172033; --muted:#526078; --line:#d8e1ed; --paper:#fff; --wash:#f1f5f9; --success:#047857; --danger:#b91c1c; }
    * { box-sizing: border-box; }
    body { margin:0; min-width:320px; background:var(--wash); color:var(--ink); font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { background:linear-gradient(135deg,var(--blue-dark),var(--blue)); color:#fff; padding:28px 20px 24px; }
    header > div, main { max-width:760px; margin:auto; }
    h1 { margin:0; font-size:clamp(1.8rem,5vw,2.5rem); letter-spacing:-.03em; }
    header p { margin:6px 0 0; opacity:.9; }
    main { padding:20px 16px 42px; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:0 2px 8px #0f172a0d; padding:20px; margin-bottom:16px; }
    h2 { margin:0 0 16px; font-size:1.15rem; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .full { grid-column:1 / -1; }
    label { display:block; color:var(--muted); font-size:.9rem; font-weight:650; }
    select, input, button { font:inherit; }
    select, input { width:100%; margin-top:6px; border:1px solid #b8c5d6; border-radius:10px; background:#fff; color:var(--ink); padding:12px; min-height:46px; }
    select:focus, input:focus, button:focus-visible { outline:3px solid #7dd3fc; outline-offset:2px; }
    .hint { margin:10px 0 0; color:var(--muted); font-size:.87rem; }
    .rubber { border-top:1px solid var(--line); padding:20px 0 0; margin-top:20px; }
    .rubber:first-child { border-top:0; padding-top:0; margin-top:0; }
    .rubber-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 12px; font-size:1rem; }
    .result { color:var(--muted); font-size:.9rem; font-weight:650; text-align:right; }
    .sets { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-top:14px; }
    .set { border:1px solid var(--line); border-radius:12px; padding:10px; background:#f8fafc; }
    .set strong { display:block; text-align:center; font-size:.82rem; color:var(--muted); }
    .set-fields { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:7px; }
    .set input { padding:8px; min-height:40px; text-align:center; }
    .summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .score-box { border-radius:12px; padding:16px; background:#e0f2fe; text-align:center; }
    .score-box strong { display:block; font-size:2rem; line-height:1.1; color:var(--blue-dark); }
    .score-box span { display:block; color:var(--muted); font-size:.86rem; margin-top:5px; }
    .validation { min-height:1.35em; margin:12px 0 0; color:var(--danger); font-weight:600; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    button { min-height:46px; border:0; border-radius:10px; cursor:pointer; padding:10px 15px; font-weight:700; background:var(--blue); color:#fff; }
    button:hover { background:var(--blue-dark); }
    button.secondary { color:var(--blue-dark); background:#e0f2fe; }
    #copy-status { color:var(--success); font-weight:650; align-self:center; }
    footer { color:var(--muted); font-size:.83rem; text-align:center; padding:4px 0; }
    @media (max-width:520px) { .grid { grid-template-columns:1fr; } .full { grid-column:auto; } .sets { gap:7px; } .card { padding:16px; } }
  </style>
</head>
<body>
  <header><div><h1>SDLTA Scorecard</h1><p>Record a match on court, from your phone.</p></div></header>
  <main>
    <form id="scorecard" novalidate>
      <section class="card" aria-labelledby="match-details"><h2 id="match-details">Match details</h2>
        <div class="grid">
          <label>League<select name="league" required><option value="">Choose a league</option><option>Men's Summer</option><option>Ladies' Summer</option><option>Men's Late Summer</option><option>Ladies' Late Summer</option><option>Weekend Mixed</option></select></label>
          <label>Division<select name="division" required><option value="">Choose a division</option><option>Division 1</option><option>Division 2</option><option>Division 3</option></select></label>
          <label>Home team<select name="homeTeam" required><option value="">Choose home team</option><option>Graves</option><option>Hallamshire</option><option>Chesterfield</option></select></label>
          <label>Away team<select name="awayTeam" required><option value="">Choose away team</option><option>Graves</option><option>Hallamshire</option><option>Chesterfield</option></select></label>
          <label class="full">Number of rubbers<select name="rubbers" id="rubber-count"><option value="2">2 rubbers</option><option value="3" selected>3 rubbers</option></select></label>
        </div><p class="hint">This version saves your entries on this device until you reset them.</p>
      </section>
      <section class="card" aria-labelledby="rubbers-title"><h2 id="rubbers-title">Rubbers</h2><div id="rubbers"></div></section>
      <section class="card" aria-labelledby="summary-title"><h2 id="summary-title">Match summary</h2>
        <div class="summary-grid"><div class="score-box"><strong id="home-rubbers">0</strong><span id="home-summary">Home rubbers</span></div><div class="score-box"><strong id="away-rubbers">0</strong><span id="away-summary">Away rubbers</span></div></div>
        <p class="hint" id="sets-summary">Sets: 0–0</p><p class="validation" id="validation" role="alert"></p>
        <div class="actions"><button type="button" id="copy">Copy summary</button><button type="button" class="secondary" id="reset">Reset scorecard</button><span id="copy-status" role="status"></span></div>
      </section>
    </form><footer>SDLTA Scorecard · Scores are stored only in this browser.</footer>
  </main>
  <script>
    const form = document.querySelector('#scorecard');
    const rubbersContainer = document.querySelector('#rubbers');
    const storageKey = 'sdlta-scorecard-v1';
    const blankRubber = i => `<article class="rubber" data-rubber="${i}"><h3 class="rubber-title">Rubber ${i + 1}<span class="result">Not decided</span></h3><div class="grid"><label>Home players<input name="r${i}-home-players" autocomplete="name" placeholder="e.g. A. Smith / B. Jones"></label><label>Away players<input name="r${i}-away-players" autocomplete="name" placeholder="e.g. C. Taylor / D. Khan"></label></div><div class="sets">${[1,2,3].map(set => `<div class="set"><strong>Set ${set}</strong><div class="set-fields"><input aria-label="Rubber ${i + 1}, set ${set}, home score" name="r${i}-s${set}-home" type="number" inputmode="numeric" min="0" max="99" placeholder="H"><input aria-label="Rubber ${i + 1}, set ${set}, away score" name="r${i}-s${set}-away" type="number" inputmode="numeric" min="0" max="99" placeholder="A"></div></div>`).join('')}</div></article>`;
    function data() { return Object.fromEntries(new FormData(form)); }
    function renderRubbers() { const existing = data(); const count = Number(form.rubbers.value || 3); rubbersContainer.innerHTML = Array.from({length:count}, (_,i) => blankRubber(i)).join(''); Object.entries(existing).forEach(([key,value]) => { const field = form.elements.namedItem(key); if (field) field.value = value; }); update(); }
    function scoreOf(i) { let homeSets=0, awaySets=0, completeSets=0; for (let set=1; set<=3; set++) { const h=Number(form.elements['r'+i+'-s'+set+'-home'].value), a=Number(form.elements['r'+i+'-s'+set+'-away'].value); const hasHome=form.elements['r'+i+'-s'+set+'-home'].value !== '', hasAway=form.elements['r'+i+'-s'+set+'-away'].value !== ''; if (!hasHome && !hasAway) continue; if (!hasHome || !hasAway || h === a) continue; completeSets++; h>a ? homeSets++ : awaySets++; } return {homeSets,awaySets,completeSets,winner: homeSets >= 2 ? 'home' : awaySets >= 2 ? 'away' : null}; }
    function update() { let homeRubbers=0, awayRubbers=0, homeSets=0, awaySets=0; const count=Number(form.rubbers.value || 3); for(let i=0;i<count;i++){ const s=scoreOf(i); homeSets+=s.homeSets; awaySets+=s.awaySets; if(s.winner==='home') homeRubbers++; if(s.winner==='away') awayRubbers++; const label=document.querySelector('[data-rubber="'+i+'"] .result'); label.textContent=s.winner ? (s.winner==='home' ? 'Home wins' : 'Away wins')+' ('+s.homeSets+'–'+s.awaySets+')' : s.completeSets ? 'In progress ('+s.homeSets+'–'+s.awaySets+')' : 'Not decided'; } document.querySelector('#home-rubbers').textContent=homeRubbers; document.querySelector('#away-rubbers').textContent=awayRubbers; document.querySelector('#home-summary').textContent=(form.homeTeam.value || 'Home')+' rubbers'; document.querySelector('#away-summary').textContent=(form.awayTeam.value || 'Away')+' rubbers'; document.querySelector('#sets-summary').textContent='Sets: '+homeSets+'–'+awaySets; const error=form.homeTeam.value && form.homeTeam.value===form.awayTeam.value ? 'Home and away teams must be different.' : ''; document.querySelector('#validation').textContent=error; localStorage.setItem(storageKey, JSON.stringify(data())); }
    form.addEventListener('input', update); form.addEventListener('change', event => { if (event.target.id === 'rubber-count') renderRubbers(); else update(); });
    document.querySelector('#reset').addEventListener('click', () => { if (confirm('Reset all match details and scores?')) { localStorage.removeItem(storageKey); form.reset(); renderRubbers(); } });
    document.querySelector('#copy').addEventListener('click', async () => { const d=data(), count=Number(d.rubbers||3); const lines=['SDLTA Scorecard', d.league||'League not selected', d.division||'Division not selected', (d.homeTeam||'Home')+' vs '+(d.awayTeam||'Away')]; for(let i=0;i<count;i++){const s=scoreOf(i);lines.push('Rubber '+(i+1)+': '+s.homeSets+'–'+s.awaySets+(s.winner?' ('+(s.winner==='home'?(d.homeTeam||'Home'):(d.awayTeam||'Away'))+' wins)':''));} lines.push('Rubbers: '+document.querySelector('#home-rubbers').textContent+'–'+document.querySelector('#away-rubbers').textContent); try { await navigator.clipboard.writeText(lines.join('\n')); document.querySelector('#copy-status').textContent='Copied.'; } catch { document.querySelector('#copy-status').textContent='Copy is not available in this browser.'; } });
    try { const saved=JSON.parse(localStorage.getItem(storageKey)); if(saved) Object.entries(saved).forEach(([key,value]) => { const field=form.elements.namedItem(key); if(field) field.value=value; }); } catch {} renderRubbers();
  </script>
</body>
</html>
